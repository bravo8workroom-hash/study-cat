<!DOCTYPE html>
<html lang="ko">
<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#19162B">
<title>공부하는 고양이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#19162B; --slate:#4D4C6B; --mist:#6A6986;
  --paper:#FDFEFF; --orange:#FEB686; --cream:#FFE9C3;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink); color:var(--paper);
  font-family:'Montserrat','Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;
  font-weight:500; overscroll-behavior:none;
}
#app{max-width:430px;margin:0 auto;min-height:100dvh;position:relative;padding:0 18px 110px}

/* ---------- 공통 ---------- */
.screen{display:none;animation:fadein .25s ease}
.screen.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.pill.cream{background:var(--cream);color:var(--ink)}
.pill.line{border:1.6px solid var(--paper);color:var(--paper)}
.pill.orange{background:var(--orange);color:var(--ink)}
.blob{background:var(--paper);color:var(--ink);border-radius:30px;position:relative}
.drips{position:relative;height:0}
.drip{position:absolute;top:-14px;background:var(--paper);border-radius:50%}
h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--mist);font-size:13px}
.center{text-align:center}
button{font-family:inherit;border:none;cursor:pointer}

/* ---------- 헤더 ---------- */
header{display:flex;justify-content:space-between;align-items:center;padding:22px 2px 16px}
.logo{font-size:19px;font-weight:800}
.logo small{display:block;font-size:11px;font-weight:600;color:var(--orange);letter-spacing:.5px}

/* ---------- 홈 히어로 ---------- */
.hero{padding:20px 20px 24px;border-radius:34px 34px 40px 30px;margin-bottom:26px}
.hero-top{display:flex;align-items:center;gap:14px}
.hero-top img{width:112px;flex:none}
.hero-msg{font-size:15.5px;font-weight:700;line-height:1.45;color:var(--ink)}
.hero-msg .sub{font-weight:600;margin-top:4px}
.statrow{display:flex;gap:8px;margin-top:16px}
.stat{flex:1;background:var(--cream);border-radius:18px;padding:10px 6px;text-align:center}
.stat.o{background:var(--orange)}
.stat b{display:block;font-size:17px;font-weight:800;color:var(--ink)}
.stat span{font-size:11px;color:var(--slate);font-weight:600}
.hero .drip1{left:38px;width:20px;height:20px;top:-10px}
.hero .drip2{left:70px;width:12px;height:12px;top:-6px}

/* ---------- 세션 카드 ---------- */
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 12px}
.sect h2{font-size:16px;font-weight:800}
.sect .sub{font-size:12.5px}
.scard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--paper);color:var(--ink);border-radius:26px;padding:14px 16px;margin-bottom:12px;
  transition:transform .12s}
.scard:active{transform:scale(.98)}
.scard img{width:58px;height:58px;object-fit:contain;flex:none;background:var(--paper);border-radius:50%;padding:6px;border:2px solid var(--cream)}
.scard .t{font-size:15px;font-weight:800}
.scard .d{font-size:12px;color:var(--mist);font-weight:600;margin-top:2px}
.scard .go{margin-left:auto;flex:none;width:38px;height:38px;border-radius:50%;background:var(--orange);
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--ink)}
.scard.done{background:var(--cream)}
.scard.done .go{background:var(--ink);color:var(--cream)}
.scard.lock{background:transparent;border:1.6px dashed var(--slate);color:var(--paper)}
.scard.lock .t{color:var(--paper)} .scard.lock .d{color:var(--mist)}
.scard.lock .go{background:transparent;border:1.6px solid var(--slate);color:var(--mist)}
.scard.lock img{border-color:var(--slate)}
.tip{margin:18px 6px 0;font-size:12.5px;color:var(--mist);line-height:1.6}
.tip b{color:var(--cream);font-weight:700}

/* ---------- 학습(카드) 화면 ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:20px 0 14px}
.back{width:38px;height:38px;border-radius:50%;border:1.6px solid var(--slate);background:none;color:var(--paper);font-size:16px}
.ptrack{flex:1;height:10px;background:rgba(253,254,255,.14);border-radius:99px;overflow:hidden}
.pfill{height:100%;width:0%;background:var(--orange);border-radius:99px;transition:width .3s}
.pcount{font-size:12.5px;font-weight:700;color:var(--cream);min-width:40px;text-align:right}
.flip{perspective:1200px;margin:18px 0}
.flip-inner{position:relative;width:100%;height:340px;transform-style:preserve-3d;transition:transform .45s}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);color:var(--ink);border-radius:34px 34px 38px 30px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px}
.face.backf{transform:rotateY(180deg);background:var(--cream)}
.face .word{font-size:38px;font-weight:800;letter-spacing:-.5px}
.face .mean{font-size:30px;font-weight:800}
.face .ex{font-size:15px;color:var(--slate);text-align:center;line-height:1.55;font-weight:600}
.face .hintt{font-size:11.5px;color:var(--mist);font-weight:600;position:absolute;bottom:18px}
.spk{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--cream);font-size:19px}
.face img.catimg{height:74px;position:absolute;top:18px;right:22px;opacity:.95}
.btnrow{display:flex;gap:10px;margin-top:6px}
.bigbtn{flex:1;padding:16px;border-radius:22px;font-size:15px;font-weight:800}
.bigbtn.o{background:var(--orange);color:var(--ink)}
.bigbtn.c{background:var(--cream);color:var(--ink)}
.bigbtn.g{background:transparent;border:1.6px solid var(--slate);color:var(--paper)}

/* ---------- 퀴즈 ---------- */
.qword{background:var(--paper);color:var(--ink);border-radius:30px;padding:26px 20px;text-align:center;margin:38px 0 16px;position:relative}
.qword .word{font-size:32px;font-weight:800}
.qword .dir{font-size:12px;color:var(--mist);font-weight:700;margin-bottom:6px}
.qword img{width:62px;height:62px;object-fit:contain;position:absolute;top:-34px;right:16px;background:var(--cream);border-radius:50%;padding:7px;border:3px solid var(--ink)}
.opt{display:block;width:100%;background:var(--paper);color:var(--ink);border-radius:20px;
  padding:15px 18px;font-size:16px;font-weight:700;margin-bottom:10px;text-align:left;transition:transform .1s}
.opt:active{transform:scale(.98)}
.opt.correct{background:var(--orange)}
.opt.wrong{background:var(--slate);color:var(--paper);text-decoration:line-through}
.opt.dim{opacity:.45;pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
.fb{min-height:64px;margin-top:4px;display:flex;align-items:center;gap:10px;color:var(--cream);font-size:14px;font-weight:700;line-height:1.4}
.fb img{width:54px;height:54px;object-fit:contain;background:var(--paper);border-radius:50%;padding:6px;flex:none}

/* ---------- 완료 ---------- */
.donewrap{padding-top:40px;text-align:center}
.donecard{padding:34px 24px 30px;border-radius:38px 34px 42px 34px}
.donecard img{height:120px}
.donecard h1{color:var(--ink);margin-top:8px}
.donecard p{color:var(--slate);font-size:14px;font-weight:600;margin-top:8px;line-height:1.5}
.bigpoint{font-size:44px;font-weight:800;color:var(--ink);margin-top:10px}
.bigpoint small{font-size:16px;color:var(--mist)}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .5s ease}

/* ---------- 단어장/기록/설정 ---------- */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px;margin-bottom:14px}
.chip{flex:none;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;background:none;border:1.6px solid var(--slate);color:var(--paper)}
.chip.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.wrow{display:flex;align-items:center;background:var(--paper);color:var(--ink);border-radius:18px;padding:12px 16px;margin-bottom:8px}
.wrow .w{font-weight:800;font-size:15px}
.wrow .m{color:var(--mist);font-size:13px;font-weight:600;margin-left:10px}
.wrow .dots{margin-left:auto;display:flex;gap:3px}
.dot{width:8px;height:8px;border-radius:50%;background:#E4E2EE}
.dot.f{background:var(--orange)}
.empty{padding:36px 20px;text-align:center;color:var(--mist);font-size:14px;line-height:1.6}
.empty img{width:88px;height:88px;object-fit:contain;margin-bottom:10px;background:var(--paper);border-radius:50%;padding:12px}
.weekgrid{display:flex;gap:6px;justify-content:space-between;margin-bottom:16px}
.daycol{flex:1;text-align:center}
.daycol .lab{font-size:11px;color:var(--mist);font-weight:700;margin-bottom:6px}
.daycol .cell{height:52px;border-radius:14px;background:rgba(253,254,255,.08);display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center}
.mdot{width:9px;height:9px;border-radius:50%;background:rgba(253,254,255,.16)}
.mdot.f{background:var(--orange)}
.statcard{background:var(--paper);color:var(--ink);border-radius:24px;padding:16px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.statcard .k{font-size:13.5px;font-weight:700;color:var(--slate)}
.statcard .v{font-size:20px;font-weight:800}
.setrow{background:var(--paper);color:var(--ink);border-radius:22px;padding:16px 18px;margin-bottom:10px}
.setrow .k{font-weight:800;font-size:14.5px;margin-bottom:8px}
.setrow input[type=text]{width:100%;border:1.6px solid #E4E2EE;border-radius:14px;padding:12px;font-size:15px;font-family:inherit;font-weight:600}
.segs{display:flex;gap:8px}
.seg{flex:1;padding:10px;border-radius:14px;border:1.6px solid #E4E2EE;background:none;font-size:14px;font-weight:700;color:var(--ink)}
.seg.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.setbtn{width:100%;padding:14px;border-radius:18px;font-size:14.5px;font-weight:800}
.setbtn.warn{background:none;border:1.6px solid #E08585;color:#E08585}

/* ---------- 하단 내비 ---------- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:50}
.navin{max-width:430px;margin:0 auto;background:var(--paper);border-radius:28px 28px 0 0;
  display:flex;justify-content:space-around;padding:10px 8px calc(12px + env(safe-area-inset-bottom))}
.nbtn{background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mist);font-size:10.5px;font-weight:700;padding:4px 10px}
.nbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nbtn.on{color:var(--ink)}
.nbtn.on .ic{background:var(--orange);border-radius:50%;padding:7px;margin:-7px -7px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--orange);color:var(--ink);
  font-weight:800;font-size:15px;padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:all .35s;z-index:99}
.toast.show{opacity:1;bottom:130px}
/* ---------- 수학(2단계) ---------- */
#mWord{font-size:26px;line-height:1.35;text-align:center}
.solve{display:none;margin-top:14px}
.solve.on{display:block}
.sline{background:rgba(253,254,255,.09);border:1px solid rgba(253,254,255,.16);border-radius:18px;padding:12px 14px;font-size:15px;font-weight:700;line-height:1.5;margin-bottom:8px}
.solvebtn{width:100%;border-radius:999px;border:1.5px dashed rgba(254,182,134,.65);background:transparent;color:var(--orange);font-weight:800;font-size:15px;padding:13px;margin-bottom:10px}
.mstrip{background:var(--paper);color:var(--ink);border-radius:26px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;text-align:left}
.mstrip img{width:46px;height:46px;object-fit:contain;flex:none}
.mstrip .t{font-size:15px;font-weight:800;line-height:1.3}
.mstrip .d{font-size:13px;font-weight:600;color:var(--mist);margin-top:3px;line-height:1.4}
.mstrip .go{margin-left:auto;font-size:16px;font-weight:800;flex:none}
.ladder{display:flex;gap:4px;margin-top:9px}
.rung{height:6px;flex:1;border-radius:999px;background:rgba(25,22,43,.13)}
.rung.f{background:var(--orange)}
</style>
</head>

const SESSION_DEF=[
 {n:1,title:"새 단어 만나기",desc:"오늘의 새 단어 카드",cat:"pencil"},

/* ================= 상태 ================= */
let S;
function defState(){return {points:0,streak:0,lastActive:null,words:{},log:{},settings:{name:"",newPerDay:7},math:{level:1,diagDone:false,hist:[],hi:[],mix:false}};}
function migrate(){
  if(!S.settings)S.settings={name:"",newPerDay:7};
  if(!S.math)S.math={level:1,diagDone:false,hist:[],hi:[],mix:false};
  if(!S.math.hist)S.math.hist=[];
  if(!S.math.hi)S.math.hi=[];
  if(typeof S.math.level!=="number")S.math.level=1;
  if(!S.log)S.log={};
  Object.keys(S.log).forEach(function(k){var l=S.log[k];if(!l.m)l.m=[0,0];if(l.wk===undefined)l.wk=false;});
}
function load(){try{S=JSON.parse(localStorage.getItem("catstudy"))||defState();}catch(e){S=defState();}migrate();}
function save(){try{localStorage.setItem("catstudy",JSON.stringify(S));}catch(e){}}
function todayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dayLog(k){k=k||todayKey();if(!S.log[k])S.log[k]={s:[false,false,false],newIds:[],wrong:[],quiz:[0,0],m:[0,0],wk:false};if(!S.log[k].m)S.log[k].m=[0,0];return S.log[k];}
function addDays(key,n){const d=new Date(key+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

/* ================= 유틸 ================= */
const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600);}
function level(){return Math.min(10,Math.floor(S.points/500)+1);}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");window.scrollTo(0,0);}

/* ================= 홈 ================= */
function newWordsToday(){
  const log=dayLog();
  if(log.newIds.length)return log.newIds;
  const learned=Object.keys(S.words).map(Number);
  const next=[];
  for(let i=0;i<WORDS.length&&next.length<S.settings.newPerDay;i++){if(!learned.includes(i))next.push(i);}
  log.newIds=next;save();
  return next;
}
function dueReviews(){
  const t=todayKey();const today=dayLog().newIds;
  return Object.entries(S.words).filter(([id,w])=>w.due<=t&&!today.includes(+id)).map(([id])=>+id);
}

  const name=S.settings.name||"친구";

  $("stStreak").textContent=S.streak+"일";

  const dueN=dueReviews().length;
  const list=$("sessionList");list.innerHTML="";
  SESSION_DEF.forEach((sd,i)=>{

      const k=sessionKind();
      if(k==="math"){ttl="계산 연습";desc=mathDesc();catKey="calc";}
      else if(k==="week"){ttl="주간 복습";desc="영어+수학 미니 복습 · +50P";catKey="trophy";}
      else desc="오늘 단어 + 복습 "+dueN+"개";
    }
    if(sd.n===3)desc="오늘 것 다시 꺼내기 · 자기 전 추천";

    if(done)b.onclick=()=>toast("이미 완료한 세션이야 ✓");

/* ================= 세션 진행 ================= */
let cur={session:0,cards:[],idx:0,quiz:[],qidx:0,correct:0,fromLearn:false};

function startSession(n){
  cur={session:n,cards:[],idx:0,quiz:[],qidx:0,correct:0};
  if(n===1){
    const ids=newWordsToday();
    if(!ids.length){toast("레벨 1 단어를 다 배웠어! 다음 세트가 필요해");return;}
    cur.cards=ids.slice();
    showCard();
  }else if(n===2){
    const kind=sessionKind();
    if(kind!=="eng"){startMath(kind);return;}
    const today=dayLog().newIds.filter(id=>S.words[id]);
    const due=dueReviews();
    let qs=[];
    today.forEach(id=>qs.push({id,dir:"k2e"}));
    due.slice(0,10).forEach(id=>qs.push({id,dir:"e2k"}));
    if(qs.length<6)today.forEach(id=>qs.push({id,dir:"e2k"}));
    cur.quiz=shuffle(qs);
    showQuiz();
  }else{
    const log=dayLog();
    const ids=[...new Set([...log.newIds.filter(id=>S.words[id]),...log.wrong])];
    if(!ids.length){toast("오늘 배운 게 아직 없어! 세션 1부터 시작해");return;}
    cur.cards=shuffle(ids);cur.session3quiz=true;
    showCard();
  }
}

/* ---- 카드 학습 ---- */
function showCard(){
  show("scr-learn");
  const id=cur.cards[cur.idx];const w=WORDS[id];
  $("flipCard").classList.remove("flipped");
  setTimeout(()=>{$("fWord").textContent=w[0];$("fWordSmall").textContent=w[0];$("fMean").textContent=w[1];$("fEx").innerHTML=w[2]+"<br>"+w[3];},80);
  $("learnFill").style.width=(cur.idx/cur.cards.length*100)+"%";
  $("learnCount").textContent=(cur.idx+1)+"/"+cur.cards.length;
  if(cur.session===1)setTimeout(()=>speak(w[0]),350);
}
function flipIt(){$("flipCard").classList.toggle("flipped");}
function speakCur(){speak(WORDS[cur.cards[cur.idx]][0]);}
function markCard(known){
  const id=cur.cards[cur.idx];
  if(cur.session===1&&!S.words[id]){
    const box=known?1:0;
    S.words[id]={box,due:addDays(todayKey(),INTERVALS[box]),wrong:0,seen:1};
  }
  cur.idx++;save();
  if(cur.idx<cur.cards.length){showCard();}
  else{
    cur.quiz=shuffle(cur.cards.map(id=>({id,dir:"e2k"})));
    showQuiz();
  }
}

/* ---- 퀴즈 ---- */
function showQuiz(){
  show("scr-quiz");
  const q=cur.quiz[cur.qidx];const w=WORDS[q.id];
  $("quizFill").style.width=(cur.qidx/cur.quiz.length*100)+"%";
  $("quizCount").textContent=(cur.qidx+1)+"/"+cur.quiz.length;
  $("qFb").innerHTML="";
  const e2k=q.dir==="e2k";
  $("qDir").textContent=e2k?"뜻이 뭘까?":"영어로 뭘까?";
  $("qWord").textContent=e2k?w[0]:w[1];
  if(e2k)speak(w[0]);
  const pool=shuffle(WORDS.map((_,i)=>i).filter(i=>i!==q.id)).slice(0,3);
  const opts=shuffle([q.id,...pool]);
  const box=$("qOpts");box.innerHTML="";
  opts.forEach(id=>{
    const b=document.createElement("button");
    b.className="opt";b.textContent=e2k?WORDS[id][1]:WORDS[id][0];
    b.onclick=()=>answer(b,id===q.id,q);
    box.appendChild(b);
  });
}
function answer(btn,ok,q){
  document.querySelectorAll(".opt").forEach(o=>o.classList.add("dim"));
  const w=WORDS[q.id];const log=dayLog();
  log.quiz[1]++;
  if(ok){
    btn.classList.remove("dim");btn.classList.add("correct");
    log.quiz[0]++;cur.correct++;
    srs(q.id,true);
    $("qFb").innerHTML='<img src="'+CATS.jump+'"> 정답! '+w[0]+' = '+w[1];
  }else{
    btn.classList.remove("dim");btn.classList.add("wrong");btn.classList.add("shake");
    document.querySelectorAll(".opt").forEach(o=>{if(o.textContent===(q.dir==="e2k"?w[1]:w[0])){o.classList.remove("dim");o.classList.add("correct");}});
    if(!log.wrong.includes(q.id))log.wrong.push(q.id);
    srs(q.id,false);
    $("qFb").innerHTML='<img src="'+CATS.scratch+'"> 아깝다! '+w[0]+' = '+w[1]+' — 이따 또 만나게 될 거야';
  }
  save();
  setTimeout(()=>{
    cur.qidx++;
    if(cur.qidx<cur.quiz.length)showQuiz();
    else finishSession();
  },ok?900:1700);
}
function srs(id,ok){
  const w=S.words[id];if(!w)return;
  w.seen=(w.seen||0)+1;
  if(ok){w.box=Math.min(w.box+1,INTERVALS.length-1);}
  else{w.box=0;w.wrong=(w.wrong||0)+1;}
  w.due=addDays(todayKey(),INTERVALS[w.box]);
}

/* ---- 완료 ---- */
function finishSession(){
  const log=dayLog();const i=cur.session-1;
  let pts=0,firstTime=!log.s[i];
  if(firstTime){
    log.s[i]=true;pts=30;
    if(log.s.every(Boolean))pts+=30;
    // 출석/스트릭: 하루 첫 세션 완료 시
    if(S.lastActive!==todayKey()){
      const yest=addDays(todayKey(),-1);
      S.streak=(S.lastActive===yest)?S.streak+1:1;
      S.lastActive=todayKey();
    }
    S.points+=pts;
  }
  save();
  const acc=cur.quiz.length?Math.round(cur.correct/cur.quiz.length*100):100;
  const all3=log.s.every(Boolean);
  $("doneCat").src=cur.session===3?CATS.sleeplap:all3?CATS.trophy:cur.session===1?CATS.highfive:CATS.passed;
  $("doneTitle").textContent=cur.session===3?"오늘 복습 끝!":all3?"오늘 올클리어!":"세션 "+cur.session+" 완료!";
  $("donePoint").innerHTML=firstTime?"+"+pts+'<small>P</small>':'<small>복습 완료</small>';
  let msg="정답률 "+acc+"%";
  if(cur.session===1)msg="새 단어 "+cur.cards.length+"개를 만났어. 퀴즈 정답률 "+acc+"%!";
  if(cur.session===3)msg="이제 자면 돼. 자는 동안 오늘 단어가 머리에 저장돼 🌙";
  if(all3&&cur.session!==3)msg+=" · 3세션 보너스 +30P!";
  $("doneMsg").textContent=msg;
  const card=$("doneCard");card.classList.remove("pop");void card.offsetWidth;card.classList.add("pop");
  show("scr-done");
}

let vFilter="all";
const V_CHIPS=[["all","전체"],["new","새로 배움"],["rev","복습 중"],["master","거의 마스터"],["hard","헷갈리는 것"]];
function renderVocab(){
  $("vocabChips").innerHTML="";
  V_CHIPS.forEach(([k,label])=>{
    const b=document.createElement("button");
    b.className="chip"+(vFilter===k?" on":"");b.textContent=label;
    b.onclick=()=>{vFilter=k;renderVocab();};
    $("vocabChips").appendChild(b);
  });
  const ids=Object.keys(S.words).map(Number).sort((a,b)=>a-b);
  $("vocabTotal").textContent=ids.length+" / "+WORDS.length;
  const list=$("vocabList");list.innerHTML="";
  const filt=ids.filter(id=>{
    const w=S.words[id];
    if(vFilter==="new")return w.box===0;
    if(vFilter==="rev")return w.box>=1&&w.box<=2;
    if(vFilter==="master")return w.box>=3;
    if(vFilter==="hard")return (w.wrong||0)>=2;

/* ================= 수학 사다리 (2단계) ================= */
const M_LEVELS=[
  {n:1,name:"자연수 사칙연산"},
  {n:2,name:"분수 약분과 덧셈·뺄셈"},
  {n:3,name:"분수 곱셈·나눗셈"},
  {n:4,name:"소수 사칙연산"},
  {n:5,name:"정수(음수) 계산"},
  {n:6,name:"문자식 정리와 대입"},
  {n:7,name:"일차방정식"}
];
const DIAG_PLAN=[["자연수",1,4],["분수",2,4],["소수",4,3],["정수",5,3],["문자식",6,3],["방정식",7,3]];

function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}
function fr(n,d){const g=gcd(n,d);n=n/g;d=d/g;if(d<0){n=-n;d=-d;}return d===1?String(n):n+"/"+d;}
function dc(x){return Math.round(x*100)/100;}
function jitter(ans,t){
  if(/^-?\d+(\.\d+)?$/.test(ans)){return String(dc(parseFloat(ans)+t*(t%2?1:-1)));}
  const m=ans.match(/^(-?\d+)\/(\d+)$/);if(m)return (Number(m[1])+t)+"/"+m[2];
  const x=ans.match(/^(-?\d+)x$/);if(x)return (Number(x[1])+t)+"x";
  return ans+"  ".slice(0,t);
}
function opts4(ans,cands){
  const out=[];
  (cands||[]).forEach(c=>{if(c&&c!==ans&&c!=="NaN"&&out.indexOf(c)<0)out.push(c);});
  let t=1;while(out.length<3&&t<40){const v=jitter(ans,t++);if(v!==ans&&out.indexOf(v)<0)out.push(v);}
  return shuffle([ans].concat(out.slice(0,3)));
}

function g1(){
  const op=["+","-","×","÷"][ri(0,3)];
  if(op==="+"){
    const a=ri(14,89),b=ri(14,89),s=a+b,ta=Math.floor(a/10)*10,tb=Math.floor(b/10)*10;
    return {q:a+" + "+b,a:String(s),wrong:[String(s+ri(1,9)),String(s-ri(1,9)),String(s+10)],
      steps:["십의 자리끼리 먼저: "+ta+" + "+tb+" = "+(ta+tb),
             "일의 자리끼리: "+(a%10)+" + "+(b%10)+" = "+((a%10)+(b%10)),
             "둘을 합치면 "+s]};
  }
  if(op==="-"){
    const a=ri(45,99),b=ri(13,a-8),s=a-b;
    return {q:a+" - "+b,a:String(s),wrong:[String(s+ri(1,9)),String(s-ri(1,9)),String(s+10)],
      steps:[b+"를 한 번에 빼기 어려우면 나눠서 빼자",
             a+" - "+Math.floor(b/10)*10+" = "+(a-Math.floor(b/10)*10),
             "여기서 "+(b%10)+"을 더 빼면 "+s]};
  }
  if(op==="×"){
    const a=ri(3,19),b=ri(3,12),s=a*b,b1=Math.floor(b/2),b2=b-b1;
    return {q:a+" × "+b,a:String(s),wrong:[String(s+a),String(s-a),String(a*(b+1)+1)],
      steps:[b+"을 "+b1+"과 "+b2+"로 쪼개 보자",
             a+" × "+b1+" = "+(a*b1)+" , "+a+" × "+b2+" = "+(a*b2),
             "두 값을 더하면 "+s]};
  }
  const b=ri(2,9),s=ri(3,12),a=b*s;
  return {q:a+" ÷ "+b,a:String(s),wrong:[String(s+1),String(s-1),String(s+2)],
    steps:[b+"에 몇을 곱하면 "+a+"이 될까?",
           b+" × "+(s-1)+" = "+(b*(s-1))+" 은 아직 작아",
           b+" × "+s+" = "+a+" 이니까 답은 "+s]};
}
function g2(){
  if(Math.random()<0.5){
    const d0=ri(3,9),n0=ri(1,d0-1),k=ri(2,6),n=n0*k,d=d0*k;
    return {q:n+"/"+d+" 를 가장 간단하게",a:fr(n0,d0),wrong:[fr(n0*2,d0*2+1),(n0+1)+"/"+d0,n0+"/"+(d0+1)],
      steps:["분자 "+n+"과 분모 "+d+"를 같은 수로 나눌 수 있어",
             "둘 다 "+k+"로 나누면 "+n+"÷"+k+" = "+n0+", "+d+"÷"+k+" = "+d0,
             "그래서 "+fr(n0,d0)]};
  }
  const d1=ri(2,7),k=ri(1,3)===1?1:ri(2,3),d2=d1*k;
  const n1=ri(1,d1-1||1),n2=ri(1,d2-1||1),plus=Math.random()<0.6;
  const num=plus?(n1*k+n2):(n1*k-n2);
  return {q:n1+"/"+d1+(plus?" + ":" - ")+n2+"/"+d2,a:fr(num,d2),
    wrong:[fr(n1+n2,d1+d2),(num+1)+"/"+d2,fr(num,d1)],
    steps:["분모가 다르면 먼저 같게 만들자",
           n1+"/"+d1+" = "+(n1*k)+"/"+d2+" (위아래 "+k+"배)",
           (n1*k)+(plus?" + ":" - ")+n2+" = "+num+" 이니까 "+fr(num,d2)]};
}
function g3(){
  const a=ri(1,7),b=ri(2,9),c=ri(1,7),d=ri(2,9);
  if(Math.random()<0.55){
    return {q:a+"/"+b+" × "+c+"/"+d,a:fr(a*c,b*d),wrong:[fr(a+c,b+d),fr(a*d,b*c),(a*c)+"/"+(b+d)],
      steps:["분수 곱셈은 분자끼리, 분모끼리 곱해",
             "분자 "+a+"×"+c+" = "+(a*c)+" , 분모 "+b+"×"+d+" = "+(b*d),
             "약분하면 "+fr(a*c,b*d)]};
  }
  return {q:a+"/"+b+" ÷ "+c+"/"+d,a:fr(a*d,b*c),wrong:[fr(a*c,b*d),fr(a+d,b+c),(a*d)+"/"+(b+c)],
    steps:["나눗셈은 뒤 분수를 뒤집어서 곱하기",
           a+"/"+b+" × "+d+"/"+c,
           "분자 "+(a*d)+", 분모 "+(b*c)+" → "+fr(a*d,b*c)]};
}
function d10(){let v=ri(11,99);if(v%10===0)v+=ri(1,9);return dc(v/10);}
function g4(){
  const r=Math.random();
  if(r<0.45){
    const a=d10(),b=d10(),plus=Math.random()<0.6,s=dc(plus?a+b:Math.abs(a-b));
    const x=plus?a:Math.max(a,b),y=plus?b:Math.min(a,b);
    return {q:x+(plus?" + ":" - ")+y,a:String(s),wrong:[String(dc(s+0.1)),String(dc(s-0.1)),String(dc(s+1))],
      steps:["소수점 위치를 딱 맞춰 세로로 쓰자",
             "소수점을 빼고 "+Math.round(x*10)+(plus?" + ":" - ")+Math.round(y*10)+" = "+Math.round(dc(plus?x+y:x-y)*10),
             "소수점 한 자리를 되돌리면 "+s]};
  }
  const a=d10(),b=ri(2,9),s=dc(a*b);
  return {q:a+" × "+b,a:String(s),wrong:[String(dc(s*10)),String(dc(s/10)),String(dc(s+b))],
    steps:["소수점을 잠깐 치우고 계산해 보자",
           Math.round(a*10)+" × "+b+" = "+Math.round(a*10)*b,
           "소수점 한 자리를 다시 넣으면 "+s]};
}
function g5(){
  const ops=["+","-","×"],op=ops[ri(0,2)];
  let a=ri(-19,19)||-7,b=ri(-15,15)||6;
  if(op==="×"){a=ri(-9,9)||-4;b=ri(-9,9)||3;}
  const s=op==="+"?a+b:op==="-"?a-b:a*b;
  const bs=b<0?"("+b+")":String(b);
  return {q:a+" "+op+" "+bs,a:String(s),wrong:[String(-s),String(s+1),String(s-2)],
    steps:op==="×"?["부호끼리 먼저: 같으면 +, 다르면 -",
                    "숫자만 보면 "+Math.abs(a)+" × "+Math.abs(b)+" = "+Math.abs(a*b),
                    "부호를 붙이면 "+s]
                 :["수직선에서 "+a+"에서 출발해",
                   (op==="+"?b+"만큼 ":"반대로 "+b+"만큼 ")+(s>a?"오른쪽":"왼쪽")+"으로 이동",
                   "도착한 곳이 "+s]};
}
function g6(){
  if(Math.random()<0.5){
    const a=ri(2,9),b=ri(2,9),plus=Math.random()<0.65,s=plus?a+b:a-b;
    return {q:a+"x "+(plus?"+":"-")+" "+b+"x 를 간단히",a:s+"x",wrong:[(a*b)+"x",(plus?a+b:b-a)+"x",String(s)],
      steps:["x가 붙은 것끼리는 같은 종류(동류항)야",
             "x를 물건이라 보면 "+a+"개 "+(plus?"+":"-")+" "+b+"개",
             "= "+s+"개 → "+s+"x"]};
  }
  const x=ri(2,7),a=ri(2,6),b=ri(1,12),plus=Math.random()<0.7,s=plus?a*x+b:a*x-b;
  return {q:"x = "+x+" 일 때, "+a+"x "+(plus?"+":"-")+" "+b,a:String(s),
    wrong:[String(a+x+(plus?b:-b)),String(s+a),String(plus?a*x-b:a*x+b)],
    steps:["x 자리에 "+x+"를 그대로 넣어",
           a+" × "+x+" = "+(a*x),
           (a*x)+" "+(plus?"+":"-")+" "+b+" = "+s]};
}
function g7(){
  const a=ri(2,7),x=ri(2,12),b=ri(1,20),plus=Math.random()<0.6,c=plus?a*x+b:a*x-b;
  return {q:a+"x "+(plus?"+":"-")+" "+b+" = "+c+" 에서 x",a:String(x),
    wrong:[String(x+1),String(x-1),String(c-b)],
    steps:["x만 남기려면 먼저 숫자를 반대로 넘겨",
           a+"x = "+c+" "+(plus?"-":"+")+" "+b+" = "+(a*x),
           "양쪽을 "+a+"로 나누면 x = "+x]};
}
const M_GEN=[g1,g2,g3,g4,g5,g6,g7];
function genMath(lv){const p=M_GEN[Math.min(6,Math.max(0,lv-1))]();p.lv=lv;return p;}

function mathLevel(){return (S.math&&S.math.level)||1;}
function recentAcc(){
  const h=(S.math.hist||[]).slice(-20);
  if(!h.length)return null;
  return h.reduce((a,b)=>a+b,0)/h.length;
}
function pickLevel(){
  const L=mathLevel();
  if(S.math.mix&&L>1&&Math.random()<0.4)return L-1;
  return L;
}
function buildMathSet(n){
  const out=[];
  for(let i=0;i<n;i++){const p=genMath(pickLevel());p.type="math";p.opts=opts4(p.a,p.wrong);out.push(p);}
  return out;
}
function buildEngSet(n){
  const ids=Object.keys(S.words).map(Number);
  if(!ids.length)return [];
  return shuffle(ids).slice(0,n).map(id=>{
    const w=WORDS[id];
    const pool=shuffle(WORDS.map((_,i)=>i).filter(i=>i!==id)).slice(0,3);
    return {type:"eng",id:id,q:w[0],dir:"무슨 뜻일까?",a:w[1],
      opts:shuffle([w[1]].concat(pool.map(i=>WORDS[i][1]))),steps:[w[2],w[3]]};
  });
}
function buildDiag(){
  const out=[];
  DIAG_PLAN.forEach(function(row,ai){
    const n=row[2];
    for(let i=0;i<n;i++){
      const lv=(ai===1&&i>=2)?3:row[1];
      const p=genMath(lv);p.type="math";p.area=ai;p.areaName=row[0];p.opts=opts4(p.a,p.wrong);out.push(p);
    }
  });
  return out;
}

  if(!done)el.querySelector(".mstrip").onclick=function(){startDiag();};

let mc={mode:"math",list:[],idx:0,correct:0,locked:false};
function startMath(kind){
  if(!S.math.diagDone){startDiag();return;}
  mc={mode:kind==="week"?"week":"math",list:[],idx:0,correct:0,locked:false,promoted:false};
  mc.list=kind==="week"?shuffle(buildMathSet(6).concat(buildEngSet(6))):buildMathSet(10);
  if(!mc.list.length){toast("문제를 만들지 못했어. 다시 해 볼까?");return;}
  showMathQ();
}
function startDiag(){
  mc={mode:"diag",list:buildDiag(),idx:0,correct:0,locked:false,skip:{},wrongRun:0,lastArea:-1,areaScore:{}};
  showMathQ();
}
function showMathQ(){
  if(mc.mode==="diag"){while(mc.idx<mc.list.length&&mc.skip[mc.list[mc.idx].area])mc.idx++;}
  if(mc.idx>=mc.list.length){return mc.mode==="diag"?finishDiag():finishMath();}
  const p=mc.list[mc.idx];
  mc.locked=false;mc.stepsLeft=null;
  if(mc.mode==="diag"&&p.area!==mc.lastArea){mc.wrongRun=0;mc.lastArea=p.area;}
  $("mathFill").style.width=Math.round(mc.idx/mc.list.length*100)+"%";
  $("mathCount").textContent=(mc.idx+1)+"/"+mc.list.length;
  $("mDir").textContent=p.type==="eng"?"영어 · "+p.dir:(mc.mode==="diag"?p.areaName+" 알아보기":M_LEVELS[p.lv-1].name);
  $("mWord").textContent=p.q;
  const box=$("mOpts");box.innerHTML="";
  p.opts.forEach(function(o){
    const b=document.createElement("button");b.className="opt";b.textContent=o;
    b.onclick=function(){mathAnswer(b,o,p);};box.appendChild(b);
  });
  $("mFb").innerHTML="";
  const sv=$("mSolve");sv.className="solve";sv.innerHTML="";
  $("mNext").style.display="none";
  show("scr-math");
}
function mathAnswer(btn,val,p){
  if(mc.locked)return;mc.locked=true;
  const ok=val===p.a;
  document.querySelectorAll("#mOpts .opt").forEach(function(b){
    b.onclick=null;
    if(b.textContent===p.a)b.classList.add("correct");
    else if(b===btn)b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if(ok){mc.correct++;$("mFb").innerHTML='<img src="'+CATS.jump+'">좋아, 맞았어!';}
  else{
    $("mFb").innerHTML='<img src="'+CATS.scratch+'">답은 '+p.a+'. 풀이를 한 줄씩 볼까?';
    openSolve(p);
  }
  if(mc.mode==="diag"){
    mc.areaScore[p.area]=(mc.areaScore[p.area]||0)+(ok?1:0);
    if(ok)mc.wrongRun=0;else{mc.wrongRun++;if(mc.wrongRun>=2){mc.skip[p.area]=true;mc.wrongRun=0;}}
  }else{
    if(p.type==="math"){
      S.math.hist.push(ok?1:0);
      if(S.math.hist.length>60)S.math.hist=S.math.hist.slice(-60);
    }else{
      srs(p.id,ok);
      const lg=dayLog();
      if(!ok&&lg.wrong.indexOf(p.id)<0)lg.wrong.push(p.id);
    }
    const lg2=dayLog();lg2.m[1]++;if(ok)lg2.m[0]++;
    save();
  }
  $("mNext").textContent=(mc.idx+1>=mc.list.length)?"끝내기 →":"다음 →";
  $("mNext").style.display="block";
}
function openSolve(p){
  const sv=$("mSolve");sv.className="solve on";
  mc.stepsLeft=(p.steps||[]).slice();
  if(!mc.stepsLeft.length){sv.className="solve";return;}
  sv.innerHTML='<button class="solvebtn" onclick="nextStep()">풀이 한 줄 보기</button>';
}
function nextStep(){
  const sv=$("mSolve"),btn=sv.querySelector(".solvebtn");
  const line=mc.stepsLeft&&mc.stepsLeft.length?mc.stepsLeft.shift():null;
  if(line===null){if(btn)btn.remove();return;}
  const d=document.createElement("div");d.className="sline";d.textContent=line;
  sv.insertBefore(d,btn);
  if(!mc.stepsLeft.length&&btn){btn.textContent="이해했어!";btn.onclick=function(){btn.remove();};}
}
function mathNext(){mc.idx++;mc.locked=false;showMathQ();}

function checkPromotion(){
  mc.promoted=false;
  const acc=recentAcc(),h=(S.math.hist||[]);
  if(acc===null)return;
  const t=todayKey();
  if(h.length>=10&&acc>=0.8){
    if(S.math.hi.indexOf(t)<0)S.math.hi.push(t);
    if(S.math.hi.indexOf(addDays(t,-1))>=0&&S.math.level<7){
      S.math.level++;S.points+=100;S.math.hi=[];S.math.hist=[];S.math.mix=false;mc.promoted=true;
    }
    if(S.math.hi.length>6)S.math.hi=S.math.hi.slice(-6);
  }
  if(h.length>=10){ if(acc<0.5)S.math.mix=true; else if(acc>=0.65)S.math.mix=false; }
}
function finishMath(){
  const total=mc.list.length,acc=total?Math.round(mc.correct/total*100):0;
  let extra=0;
  if(mc.mode==="week"){const lg=dayLog();if(!lg.wk){lg.wk=true;extra=50;S.points+=50;}}
  checkPromotion();save();
  cur={session:2,cards:[],idx:0,quiz:new Array(total).fill(0),qidx:0,correct:mc.correct};
  finishSession();
  $("doneCat").src=mc.mode==="week"?CATS.trophy:CATS.calc;
  $("doneTitle").textContent=mc.mode==="week"?"주간 복습 끝!":"계산 연습 끝!";
  let msg="정답률 "+acc+"%";
  if(extra)msg+=" · 주간 복습 보너스 +50P";
  if(mc.promoted)msg+=" · 사다리 "+mathLevel()+"단계로 올라갔어! +100P";
  else if(acc>=80)msg+=" · 이 속도면 곧 한 칸 올라가";
  $("doneMsg").textContent=msg;
  if(mc.promoted)setTimeout(function(){toast("사다리 "+mathLevel()+"단계 도착! +100P");},900);
}
function finishDiag(){
  let lvl=1;
  for(let i=0;i<DIAG_PLAN.length;i++){
    const n=DIAG_PLAN[i][2],sc=mc.areaScore[i]||0;
    if(mc.skip[i]||sc<Math.ceil(n*0.6))break;
    lvl=DIAG_PLAN[i+1]?DIAG_PLAN[i+1][1]:7;
  }
  lvl=Math.min(7,Math.max(1,lvl));
  S.math.diagDone=true;S.math.level=lvl;S.math.hist=[];S.math.hi=[];S.math.mix=false;
  S.points+=30;save();
  $("doneCat").src=CATS.calc;
  $("doneTitle").textContent="출발점을 찾았어!";
  $("donePoint").innerHTML="+30<small>P</small>";
  $("doneMsg").textContent="너한테 딱 맞는 시작은 "+lvl+"단계 · "+M_LEVELS[lvl-1].name+". 여기서부터 한 칸씩 올라가 보자!";
  const card=$("doneCard");card.classList.remove("pop");void card.offsetWidth;card.classList.add("pop");
  show("scr-done");
}

/* ================= 내비 ================= */
function setNav(t){document.querySelectorAll(".nbtn").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));}
function tab(t){
  setNav(t);
  if(t==="home"){renderHome();show("scr-home");}
  if(t==="vocab"){renderVocab();show("scr-vocab");}
  if(t==="stats"){renderStats();show("scr-stats");}
  if(t==="set"){renderSet();show("scr-set");}
}

/* ================= 시작 ================= */
load();
document.addEventListener("DOMContentLoaded",()=>{
  $("setName").addEventListener("input",e=>{S.settings.name=e.target.value.trim();save();});
  renderHome();
});
</script>
</body>
