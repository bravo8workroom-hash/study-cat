<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>설계실 — 공부하는 고양이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#19162B; --panel:#221E3D; --surf:#2B2748; --line:#4D4C6B;
  --paper:#FDFEFF; --mist:#8B89A8; --dim:#6A6986;
  --orange:#FEB686; --cream:#FFE9C3;
  --ok:#8FD9B6; --warn:#FF9A8B;
  --row:34px;
  --kr:'Noto Sans KR','Malgun Gothic',sans-serif;
  --mo:'Montserrat',var(--kr);
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{
  background:var(--ink); color:var(--paper);
  font-family:var(--kr); font-weight:500; font-size:14px; line-height:1.65;
  word-break:keep-all; overflow-wrap:break-word;
  /* 한 화면 안에 다 들어오게 — 마인드맵과 달력을 같이 본다 */
  height:100vh; overflow:hidden;
  display:grid; grid-template-rows:auto auto minmax(0,1fr);
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- 상단 바 ---------- */
.bar{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:12px 22px;background:var(--panel);
  border-bottom:1px solid var(--line);
}
.brand{font-family:var(--mo);font-weight:800;font-size:16px;letter-spacing:-.2px;white-space:nowrap}
.brand em{display:block;font-style:normal;font-family:var(--kr);font-weight:500;
  font-size:10.5px;letter-spacing:.6px;color:var(--orange)}
.bar .grow{flex:1}
.fld{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mist)}
.fld input{
  background:var(--surf);border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;width:260px;font-size:12px;font-family:var(--mo);color:var(--paper);
}
.btn{
  background:var(--surf);border:1px solid var(--line);border-radius:10px;
  padding:7px 13px;font-size:12.5px;font-weight:700;white-space:nowrap;
  transition:background .15s,border-color .15s;
}
.btn:hover{background:#353061;border-color:var(--mist)}
.btn.go{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.btn.go:hover{background:#ffc9a3}
.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:8px}
.btn.danger:hover{background:#4a2436;border-color:var(--warn);color:var(--warn)}

/* ---------- 월 이동 ---------- */
.month{display:flex;align-items:center;gap:6px}
.month b{font-family:var(--mo);font-weight:800;font-size:16px;
  min-width:118px;text-align:center;font-variant-numeric:tabular-nums}
.month .btn{padding:5px 11px;font-size:15px;line-height:1}

/* ---------- 요약 띠 ---------- */
.sumbar{
  display:flex;gap:10px;flex-wrap:wrap;padding:11px 22px;
  background:var(--ink);border-bottom:1px solid var(--line);
}
.tile{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:8px 14px;min-width:104px;
}
.tile s{display:block;text-decoration:none;font-size:10.5px;color:var(--mist);letter-spacing:.3px}
.tile b{font-family:var(--mo);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.tile b i{font-style:normal;font-size:11px;font-weight:700;color:var(--mist);margin-left:2px}
.tile.math b{color:var(--cream)}
.tile.eng b{color:var(--orange)}
.tile.warn{border-color:var(--warn)}
.tile.warn b{color:var(--warn)}

/* ---------- 본문 뼈대 ----------
   왼쪽 위 마인드맵 · 왼쪽 아래 달력 · 오른쪽 상세.
   세 구역이 각자 스크롤한다. 페이지 자체는 스크롤하지 않는다. */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0;overflow:hidden}
.col{min-width:0;min-height:0;display:grid;
  grid-template-rows:minmax(150px,1fr) minmax(250px,1fr)}
.mapzone{min-height:0;display:flex;flex-direction:column}
.side{border-left:1px solid var(--line);background:var(--panel);
  min-height:0;overflow:auto}
h2{font-family:var(--mo);font-weight:800;font-size:12px;letter-spacing:1.4px;
  color:var(--mist);text-transform:uppercase;margin-bottom:2px}
.pad{padding:18px 22px}

/* ---------- 마인드맵 ---------- */
.maphead{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 22px 10px}
.maphead .grow{flex:1}
.mapwrap{flex:1;min-height:0;overflow:auto;padding:4px 22px 22px}
.maplayer{position:relative}
.links{position:absolute;inset:0;overflow:visible;pointer-events:none}
.nd{
  position:absolute;display:flex;align-items:center;gap:7px;
  height:26px;padding:0 11px;border-radius:13px;
  background:var(--surf);border:1.5px solid var(--line);
  font-size:12.5px;font-weight:700;white-space:nowrap;
  transition:border-color .15s,background .15s;
}
.nd:hover{border-color:var(--mist)}
.nd.root{background:var(--paper);color:var(--ink);border-color:var(--paper);height:30px;font-size:13.5px}
.nd.subj{height:30px;font-size:13.5px;color:var(--ink)}
.nd.subj.math{background:var(--cream);border-color:var(--cream)}
.nd.subj.english{background:var(--orange);border-color:var(--orange)}
.nd.unit{background:var(--panel)}
.nd.unit.math{border-color:#6d6248}
.nd.unit.english{border-color:#6d5344}
.nd.leaf{max-width:250px}
.nd.leaf .t{overflow:hidden;text-overflow:ellipsis}
.nd.leaf.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.nd.leaf.has{border-color:var(--orange)}
.nd.leaf.has.math{border-color:var(--cream)}
.nd.leaf.added{border-style:dashed}
.nd .cnt{font-family:var(--mo);font-size:10.5px;font-weight:700;color:var(--dim)}
.nd.subj .cnt,.nd.root .cnt{color:#7a6a55}
.nd .wk{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--orange);color:var(--ink);
  font-family:var(--mo);font-size:10px;font-weight:800;font-variant-numeric:tabular-nums;
}
.nd.leaf.math .wk{background:var(--cream)}
.nd .car{font-family:var(--mo);font-size:11px;line-height:1;color:var(--mist);
  width:9px;text-align:center}
.nd.subj .car{color:#7a6a55}
.nd .done{color:var(--ok);font-size:11px}

/* ---------- 상세 패널 ---------- */
.empty{color:var(--dim);font-size:13px;padding:26px 0;text-align:center;line-height:1.9}
.dtag{display:inline-flex;gap:6px;font-size:11px;color:var(--mist);margin-bottom:6px}
.dtag i{font-style:normal;color:var(--dim)}
.dttl{font-family:var(--mo);font-weight:800;font-size:19px;line-height:1.35;
  letter-spacing:-.2px;text-wrap:balance;margin-bottom:8px}
.ddesc{font-size:13px;color:#D6D4E4;margin-bottom:16px}
.box{background:var(--surf);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;margin-bottom:12px}
.box h3{font-family:var(--mo);font-size:11px;font-weight:800;letter-spacing:1.1px;
  color:var(--mist);margin-bottom:8px}
.how{list-style:none;display:flex;flex-direction:column;gap:7px}
.how li{position:relative;padding-left:15px;font-size:13px;line-height:1.6}
.how li::before{content:"";position:absolute;left:2px;top:9px;
  width:5px;height:5px;border-radius:50%;background:var(--orange)}
.chk{font-size:13px}
.chk b{color:var(--ok);font-weight:700}
.wkrow{display:flex;gap:7px;flex-wrap:wrap}
.wkb{
  flex:1;min-width:56px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:11px;padding:8px 4px;text-align:center;
  font-family:var(--mo);font-weight:800;font-size:13px;
  transition:background .15s,border-color .15s;
}
.wkb:hover{border-color:var(--mist)}
.wkb.on{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.wkb.on.math{background:var(--cream);border-color:var(--cream)}
.wkb s{display:block;text-decoration:none;font-family:var(--kr);
  font-size:9.5px;font-weight:500;color:var(--dim);margin-top:1px}
.wkb.on s{color:#6b5b42}
.dates{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.dtrow{display:flex;align-items:center;gap:8px;font-size:12.5px;
  background:var(--panel);border-radius:9px;padding:6px 10px}
.dtrow .d{font-family:var(--mo);font-weight:700;font-variant-numeric:tabular-nums}
.dtrow .grow{flex:1}
.sbtn{font-family:var(--mo);font-size:10.5px;font-weight:800;
  border:1px solid var(--line);border-radius:7px;padding:2px 7px}
.sbtn.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1}
.hint{font-size:11.5px;color:var(--mist);line-height:1.65;margin-top:8px}
.hint b{color:var(--paper);font-weight:700}

/* ---------- 달력 ---------- */
.calwrap{border-top:1px solid var(--line);background:var(--panel);
  min-height:0;display:flex;flex-direction:column}
.calscroll{flex:1;min-height:0;overflow:auto;padding:0 22px 22px}
.cal{width:100%;min-width:900px;border-collapse:separate;border-spacing:6px}
.cal th{
  font-family:var(--mo);font-size:10.5px;font-weight:800;letter-spacing:1px;
  color:var(--mist);padding-bottom:2px;text-align:center;font-weight:800;
}
.cal th.sun{color:var(--warn)}
.cal td{vertical-align:top;padding:0}
.wcell{
  width:52px;background:var(--surf);border:1px solid var(--line);border-radius:10px;
  padding:8px 4px;text-align:center;
}
.wcell b{display:block;font-family:var(--mo);font-weight:800;font-size:13px}
.wcell s{display:block;text-decoration:none;font-size:10px;color:var(--dim);
  font-family:var(--mo);font-variant-numeric:tabular-nums;margin-top:2px}
.day{
  min-height:74px;background:var(--surf);border:1px solid var(--line);
  border-radius:10px;padding:5px 6px 6px;display:flex;flex-direction:column;gap:3px;
  transition:border-color .15s;
}
.day.out{background:transparent;border-color:#2E2A4A}
.day.today{border-color:var(--paper)}
.day.drop{border-color:var(--orange);border-style:dashed;cursor:pointer}
.day .dnum{display:flex;align-items:center;gap:5px;
  font-family:var(--mo);font-size:11.5px;font-weight:800;
  font-variant-numeric:tabular-nums;color:var(--mist)}
.day.out .dnum{color:#403B63}
.day .dnum .grow{flex:1}
.day .load{font-size:9.5px;font-weight:700;color:var(--dim)}
.day .load.over{color:var(--warn)}
.chip{
  display:flex;align-items:center;gap:5px;width:100%;text-align:left;
  background:var(--panel);border:1.5px solid transparent;border-left-width:4px;
  border-radius:7px;padding:4px 6px;font-size:11px;font-weight:700;line-height:1.35;
}
.chip.math{border-left-color:var(--cream)}
.chip.english{border-left-color:var(--orange)}
.chip:hover{background:#302B52}
.chip.on{border-color:var(--paper);border-left-color:var(--paper);background:#3A3466}
.chip.done{opacity:.5}
.chip .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .s{font-family:var(--mo);font-size:9px;font-weight:800;color:var(--dim)}
.chip.done .t{text-decoration:line-through}

/* 칩 액션 바 */
.actbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:40;
  display:flex;align-items:center;gap:9px;
  background:var(--paper);color:var(--ink);border-radius:14px;
  padding:9px 13px;box-shadow:0 10px 34px rgba(0,0,0,.5);
}
.actbar .nm{font-size:12.5px;font-weight:700;max-width:230px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actbar .btn{background:#EDEBF5;border-color:#D3D0E2;color:var(--ink)}
.actbar .btn:hover{background:#DEDBEC}
.actbar .btn.danger:hover{background:#FFE1DB;border-color:var(--warn);color:#8A3527}

/* 토스트 */
.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:82px;z-index:50;
  background:var(--paper);color:var(--ink);border-radius:11px;padding:9px 16px;
  font-size:12.5px;font-weight:700;opacity:0;pointer-events:none;transition:.22s;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 좁은 화면에서는 한 화면 고정을 풀고 그냥 위에서 아래로 쌓는다 */
@media (max-width:1180px),(max-height:620px){
  body{height:auto;overflow:visible;display:block}
  .wrap{display:block;overflow:visible}
  .col{display:block}
  .mapwrap{max-height:70vh}
  .side{border-left:none;border-top:1px solid var(--line);overflow:visible}
  .calscroll{overflow-x:auto}
}
@media print{
  body{height:auto;overflow:visible;display:block;background:#fff;color:#000}
  .wrap{display:block}
  .col{display:block}
  .bar,.side,.mapzone,.actbar,.toast,.calwrap .btn{display:none}
  .calwrap{border:none;background:#fff;display:block}
  .calscroll{overflow:visible;padding:0}
  .sumbar{border:none;padding:0 0 10px}
  .tile{background:#fff;border-color:#bbb}
  .tile s,.tile b i{color:#555}
  .tile b{color:#000!important}
  .day,.wcell{border-color:#bbb;background:#fff;min-height:0}
  .day .dnum,.wcell s{color:#555}
  .chip{background:#f2f2f2;color:#000;break-inside:avoid}
  .cal{min-width:0}
}
</style>
</head>
<body>

<div class="bar">
  <div class="brand">설계실<em>공부하는 고양이 · 학습 설계</em></div>

  <div class="month">
    <button class="btn" onclick="moveMonth(-1)" aria-label="이전 달">‹</button>
    <b id="mLabel">—</b>
    <button class="btn" onclick="moveMonth(1)" aria-label="다음 달">›</button>
    <button class="btn sm" onclick="thisMonth()">이번 달</button>
  </div>

  <div class="grow"></div>

  <label class="fld">프로젝트 폴더
    <input id="rootPath" spellcheck="false" placeholder="F:/projects/study-cat">
  </label>
  <button class="btn" onclick="openRoot()">폴더 열기</button>
  <button class="btn" onclick="openCurriculum()">커리큘럼 편집</button>
  <button class="btn" onclick="savePlan()">계획 저장</button>
  <button class="btn" onclick="$('impFile').click()">계획 불러오기</button>
  <input type="file" id="impFile" accept=".json" hidden onchange="importPlan(this)">
</div>

<div class="sumbar" id="sumbar"></div>

<div class="wrap">
  <div class="col">

    <div class="mapzone">
      <div class="maphead">
        <h2>마인드맵</h2>
        <div class="grow"></div>
        <button class="btn sm" onclick="expandAll(true)">모두 펼치기</button>
        <button class="btn sm" onclick="expandAll(false)">단원만 보기</button>
        <button class="btn sm" onclick="addNode()">+ 노드 추가</button>
      </div>
      <div class="mapwrap">
        <div class="maplayer" id="maplayer">
          <svg class="links" id="links" aria-hidden="true"></svg>
        </div>
      </div>
    </div>

    <div class="calwrap">
      <div class="maphead"><h2 id="calTitle">월간 계획</h2>
        <div class="grow"></div>
        <button class="btn sm" onclick="window.print()">인쇄</button>
        <button class="btn sm danger" onclick="clearMonth()">이 달 비우기</button>
      </div>
      <div class="calscroll"><table class="cal" id="cal"></table></div>
    </div>

  </div>

  <aside class="side">
    <div class="pad" id="detail"></div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script src="curriculum.js"></script>
<script>
/* ==========================================================
   상태
   ========================================================== */
const $ = function(id){ return document.getElementById(id); };
const DAYN = ["일","월","화","수","목","금","토"];
const LS = { plan:"catstudy_plan", root:"catstudy_root", ui:"catstudy_ui", extra:"catstudy_nodes" };

let PLAN = {};        // { "2026-08": [ {i, node, date, s, done} ] }
let ROOT = "F:/projects/study-cat";
let UI   = { open:{}, sel:null };
let EXTRA = [];       // 설계실에서 추가한 노드 (curriculum.js 에 넣기 전 임시)
let ym, cursor;       // 보고 있는 달
let chipSel = null;   // 선택한 칩(배정) id
let moving  = false;  // 날짜 옮기는 중

function jload(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function jsave(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("on"); },1700); }

/* ==========================================================
   커리큘럼 읽기 (curriculum.js + 추가 노드)
   ========================================================== */
function tree(){
  const t = CURRICULUM.subjects.map(function(s){
    return { id:s.id, name:s.name, tone:s.tone, defaultDays:s.defaultDays, note:s.note,
      units:s.units.map(function(u){
        return { id:u.id, name:u.name, subj:s.id,
          nodes:u.nodes.map(function(n){ return Object.assign({},n,{subj:s.id,unit:u.id}); }) };
      }) };
  });
  EXTRA.forEach(function(n){
    t.forEach(function(s){ s.units.forEach(function(u){
      if(u.id===n.unit) u.nodes.push(Object.assign({},n,{subj:s.id,added:true}));
    }); });
  });
  return t;
}
let T = [];
function findNode(id){
  let r=null;
  T.forEach(function(s){ s.units.forEach(function(u){ u.nodes.forEach(function(n){ if(n.id===id) r=n; }); }); });
  return r;
}
function subjOf(id){ let r=null; T.forEach(function(s){ if(s.id===id) r=s; }); return r; }
function unitOf(id){ let r=null; T.forEach(function(s){ s.units.forEach(function(u){ if(u.id===id) r=u; }); }); return r; }

/* ==========================================================
   달력 계산
   ========================================================== */
function ymOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function dkey(d){ return ymOf(d)+"-"+String(d.getDate()).padStart(2,"0"); }
function todayKey(){ return dkey(new Date()); }

/* 그 달의 주 단위 격자 — 일요일 시작, 각 줄이 곧 '1주차, 2주차 …' */
let _wk={ym:null,rows:null,of:null};
function weeks(){
  if(_wk.ym===ym) return _wk.rows;
  const rows=buildWeeks(), of={};
  rows.forEach(function(row,i){ row.forEach(function(d){ of[dkey(d)]=i+1; }); });
  _wk={ym:ym,rows:rows,of:of};
  return rows;
}
function buildWeeks(){
  const y=cursor.getFullYear(), m=cursor.getMonth();
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const start=new Date(y,m,1-first.getDay());
  const rows=[];
  let d=new Date(start);
  while(d<=last || rows.length===0){
    const row=[];
    for(let i=0;i<7;i++){ row.push(new Date(d)); d.setDate(d.getDate()+1); }
    rows.push(row);
    if(d>last) break;
  }
  return rows;
}
function weekOfDate(key){ weeks(); return _wk.of[key]||0; }
function inMonth(d){ return d.getMonth()===cursor.getMonth(); }

/* ==========================================================
   계획 읽고 쓰기
   ========================================================== */
function list(){ if(!PLAN[ym]) PLAN[ym]=[]; return PLAN[ym]; }
function ofDate(key){ return list().filter(function(a){ return a.date===key; }); }
function ofNode(id){ return list().filter(function(a){ return a.node===id; }); }
function byId(i){ let r=null; list().forEach(function(a){ if(a.i===i) r=a; }); return r; }
function nextId(){ let m=0; Object.keys(PLAN).forEach(function(k){
  PLAN[k].forEach(function(a){ if(a.i>m) m=a.i; }); }); return m+1; }
function commit(){ jsave(LS.plan,PLAN); draw(); }

function loadMin(key){
  return ofDate(key).reduce(function(t,a){
    const n=findNode(a.node); return t+((n&&n.min)||0); },0);
}

/* 주차에 넣기 — 과목 기본 요일 중 덜 찬 날부터 */
function assignWeek(nodeId, w){
  const n=findNode(nodeId); if(!n) return;
  const s=subjOf(n.subj);
  const row=weeks()[w-1]; if(!row) return;
  const days=row.filter(inMonth);
  if(!days.length){ toast("그 주에는 이 달 날짜가 없어요"); return; }

  let cand=days.filter(function(d){ return (s.defaultDays||[]).indexOf(d.getDay())>=0; });
  if(!cand.length) cand=days;
  cand=cand.filter(function(d){
    return !ofDate(dkey(d)).some(function(a){ return a.node===nodeId; }); });
  if(!cand.length){ toast("그 주에는 이미 들어가 있어요"); return; }

  cand.sort(function(a,b){ return loadMin(dkey(a))-loadMin(dkey(b)); });
  list().push({ i:nextId(), node:nodeId, date:dkey(cand[0]), s:2, done:false });
  commit();
}
function unassignWeek(nodeId, w){
  PLAN[ym]=list().filter(function(a){
    return !(a.node===nodeId && weekOfDate(a.date)===w); });
  commit();
}

/* ==========================================================
   마인드맵
   ========================================================== */
const COL = [0,150,320,560], ROW=34, LEAFW=250;

function expandAll(on){
  UI.open={};
  T.forEach(function(s){ UI.open["s:"+s.id]=true;
    s.units.forEach(function(u){ UI.open["u:"+u.id]=!!on; }); });
  jsave(LS.ui,UI); draw();
}
function toggle(k){ UI.open[k]=!UI.open[k]; jsave(LS.ui,UI); draw(); }
function pick(id){ UI.sel=id; jsave(LS.ui,UI); draw(); }

function drawMap(){
  const layer=$("maplayer"), svg=$("links");
  layer.querySelectorAll(".nd").forEach(function(e){ e.remove(); });

  const boxes=[], links=[];
  let y=0;
  const push=function(cls,col,yy,html,attr){
    const pt={cls:cls,x:COL[col],y:yy,html:html,attr:attr||"",el:null};
    boxes.push(pt);
    return pt;
  };

  const rootY={v:0};
  const subjPts=[];

  T.forEach(function(s){
    const sOpen = UI.open["s:"+s.id]!==false;
    const unitPts=[];
    const sStart=y;

    if(sOpen){
      s.units.forEach(function(u){
        const uOpen = !!UI.open["u:"+u.id];
        const uStart=y;
        const leafPts=[];

        if(uOpen){
          u.nodes.forEach(function(n){
            const asg=ofNode(n.id);
            const wks=[];
            asg.forEach(function(a){ const w=weekOfDate(a.date); if(w&&wks.indexOf(w)<0) wks.push(w); });
            wks.sort();
            const allDone = asg.length>0 && asg.every(function(a){ return a.done; });
            const cls="nd leaf "+s.id+(UI.sel===n.id?" on":"")+(asg.length?" has":"")+(n.added?" added":"");
            const html='<span class="t">'+esc(n.title)+'</span>'
              + (allDone?'<span class="done">✓</span>':'')
              + wks.map(function(w){ return '<span class="wk">'+w+'</span>'; }).join("")
              + '<span class="cnt">'+n.min+'분</span>';
            leafPts.push(push(cls,3,y,html,'onclick="pick(\''+n.id+'\')"'));
            y+=ROW;
          });
        }

        const uY = uOpen && leafPts.length ? (uStart + (leafPts.length-1)*ROW/2) : y;
        if(!uOpen) y+=ROW;
        const uCls="nd unit "+s.id;
        const uHtml='<span class="car">'+(uOpen?"▾":"▸")+'</span>'
          + esc(u.name) + '<span class="cnt">'+u.nodes.length+'</span>';
        const uPt=push(uCls,2,uY,uHtml,'onclick="toggle(\'u:'+u.id+'\')"');
        unitPts.push(uPt);
        leafPts.forEach(function(p){ links.push([uPt,p,s.id]); });
      });
    }

    const sY = sOpen && unitPts.length
      ? (unitPts[0].y + unitPts[unitPts.length-1].y)/2 : y;
    if(!sOpen) y+=ROW;
    const nodeCount=s.units.reduce(function(t,u){ return t+u.nodes.length; },0);
    const sHtml='<span class="car">'+(sOpen?"▾":"▸")+'</span>'
      + esc(s.name) + '<span class="cnt">'+nodeCount+'</span>';
    const sPt=push("nd subj "+s.id,1,sY,sHtml,'onclick="toggle(\'s:'+s.id+'\')"');
    subjPts.push({pt:sPt,id:s.id});
    unitPts.forEach(function(p){ links.push([sPt,p,s.id]); });
    if(y===sStart) y+=ROW;
    y+=10;
  });

  rootY.v = subjPts.length ? (subjPts[0].pt.y + subjPts[subjPts.length-1].pt.y)/2 : 0;
  const rPt=push("nd root",0,rootY.v,"공부하는 고양이");
  subjPts.forEach(function(o){ links.push([rPt,o.pt,o.id]); });

  const H=Math.max(y,120), W=COL[3]+LEAFW+16;
  layer.style.height=H+"px"; layer.style.width=W+"px";
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  svg.setAttribute("width",W); svg.setAttribute("height",H);

  /* 상자를 먼저 붙이고 실제 너비를 잰 뒤에 연결선을 그린다 —
     제목 길이가 제각각이라 고정 너비로 그리면 선이 뜨거나 파고든다 */
  boxes.forEach(function(b){
    const el=document.createElement("button");
    el.className=b.cls;
    el.style.left=b.x+"px"; el.style.top=b.y+"px";
    el.innerHTML=b.html;
    if(b.attr) el.setAttribute("onclick",b.attr.replace(/^onclick="/,"").replace(/"$/,""));
    layer.appendChild(el);
    b.el=el;
  });

  svg.innerHTML = links.map(function(l){
    const a=l[0], b=l[1], col = l[2]==="math" ? "#6d6248" : "#6d5344";
    const ah=a.el.offsetHeight, bh=b.el.offsetHeight;
    const x1=a.x+a.el.offsetWidth, y1=a.y+ah/2, x2=b.x-2, y2=b.y+bh/2, mx=(x1+x2)/2;
    return '<path d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2
      + '" fill="none" stroke="'+col+'" stroke-width="1.5"/>';
  }).join("");
}

/* ==========================================================
   상세 패널
   ========================================================== */
function drawDetail(){
  const box=$("detail");
  const n=UI.sel && findNode(UI.sel);
  if(!n){
    box.innerHTML='<h2>학습 내용</h2><div class="empty">'
      +'왼쪽 마인드맵에서 주제를 하나 고르세요.<br>'
      +'학습방법과 통과 기준이 여기 나오고,<br>몇 주차에 넣을지 바로 체크할 수 있어요.</div>';
    return;
  }
  const s=subjOf(n.subj), u=unitOf(n.unit);
  const asg=ofNode(n.id).slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  const rows=weeks();
  const hasWeek={}; asg.forEach(function(a){ hasWeek[weekOfDate(a.date)]=true; });

  let h='<h2>학습 내용</h2>';
  h+='<div class="dtag">'+esc(s.name)+' <i>·</i> '+esc(u.name)+' <i>·</i> '+n.min+'분</div>';
  h+='<div class="dttl">'+esc(n.title)+'</div>';
  h+='<div class="ddesc">'+esc(n.desc)+'</div>';

  h+='<div class="box"><h3>학습방법</h3><ul class="how">'
    + (n.how||[]).map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("")
    + '</ul></div>';

  h+='<div class="box"><h3>통과 기준</h3><div class="chk"><b>'+esc(n.check)+'</b></div></div>';

  h+='<div class="box"><h3>'+(cursor.getMonth()+1)+'월 어느 주에 넣을까</h3><div class="wkrow">';
  rows.forEach(function(row,i){
    const w=i+1;
    const days=row.filter(inMonth);
    const range = days.length
      ? days[0].getDate()+"–"+days[days.length-1].getDate()
      : "—";
    h+='<button class="wkb '+s.id+(hasWeek[w]?" on":"")+'" onclick="toggleWeek(\''+n.id+'\','+w+')">'
      + w+'주<s>'+range+'</s></button>';
  });
  h+='</div>';

  if(asg.length){
    h+='<div class="dates">';
    asg.forEach(function(a){
      const d=new Date(a.date+"T00:00:00");
      h+='<div class="dtrow">'
        + '<span class="d">'+(d.getMonth()+1)+'/'+d.getDate()+'('+DAYN[d.getDay()]+')</span>'
        + '<button class="sbtn'+(a.s===1?" on":"")+'" onclick="setSession('+a.i+',1)">세션1</button>'
        + '<button class="sbtn'+(a.s===2?" on":"")+'" onclick="setSession('+a.i+',2)">세션2</button>'
        + '<span class="grow"></span>'
        + '<button class="sbtn'+(a.done?" on":"")+'" onclick="toggleDone('+a.i+')">'+(a.done?"완료":"완료?")+'</button>'
        + '<button class="sbtn" onclick="removeAssign('+a.i+')">삭제</button>'
        + '</div>';
    });
    h+='</div>';
  }
  h+='</div>';

  h+='<div class="box"><h3>VS Code 에서 편집</h3><div class="acts">'
    + '<button class="btn go" onclick="openNote(\''+n.id+'\',\''+n.subj+'\')">학습방법 파일</button>'
    + '<button class="btn" onclick="openCurriculum()">노드 데이터</button>'
    + '</div>'
    + '<div class="hint">학습방법 파일에는 길게 씁니다 — 교과서에서 뽑은 문제, 아이가 막힌 곳.<br>'
    + '왼쪽에 보이는 짧은 학습방법·통과 기준을 바꾸려면 <b>노드 데이터</b>(curriculum.js)를 고치고 새로고침하세요.</div>'
    + '</div>';

  if(n.added){
    h+='<div class="box"><h3>아직 임시 노드</h3>'
      + '<div class="hint">이 노드는 이 브라우저에만 있습니다. 아래 코드를 복사해 '
      + 'curriculum.js 의 <b>'+esc(u.name)+'</b> 안에 붙여넣으면 정식 노드가 됩니다.</div>'
      + '<div class="acts" style="margin-top:9px">'
      + '<button class="btn" onclick="copyNodeCode(\''+n.id+'\')">코드 복사</button>'
      + '<button class="btn danger" onclick="dropExtra(\''+n.id+'\')">임시 노드 삭제</button>'
      + '</div></div>';
  }
  box.innerHTML=h;
}

function toggleWeek(nodeId,w){
  const has=ofNode(nodeId).some(function(a){ return weekOfDate(a.date)===w; });
  if(has) unassignWeek(nodeId,w); else assignWeek(nodeId,w);
}
function setSession(i,s){ const a=byId(i); if(a){ a.s=s; commit(); } }
function toggleDone(i){ const a=byId(i); if(a){ a.done=!a.done; commit(); } }
function removeAssign(i){ PLAN[ym]=list().filter(function(a){ return a.i!==i; });
  if(chipSel===i) chipSel=null; commit(); }

/* ==========================================================
   달력
   ========================================================== */
function drawCal(){
  const rows=weeks(), tk=todayKey();
  let h='<thead><tr><th></th>'
    + DAYN.map(function(d,i){ return '<th class="'+(i===0?"sun":"")+'">'+d+'</th>'; }).join("")
    + '</tr></thead><tbody>';

  rows.forEach(function(row,i){
    const w=i+1;
    const wMin=row.filter(inMonth).reduce(function(t,d){ return t+loadMin(dkey(d)); },0);
    h+='<tr><td><div class="wcell"><b>'+w+'주</b><s>'+wMin+'분</s></div></td>';

    row.forEach(function(d){
      const key=dkey(d), out=!inMonth(d);
      const items=ofDate(key);
      const mins=loadMin(key);
      const cls="day"+(out?" out":"")+(key===tk?" today":"")+(moving&&!out?" drop":"");
      h+='<td><div class="'+cls+'"'+(moving&&!out?' onclick="dropOn(\''+key+'\')"':'')+'>'
        + '<div class="dnum">'+d.getDate()+'<span class="grow"></span>'
        + (mins?'<span class="load'+(mins>60?" over":"")+'">'+mins+'분</span>':'')
        + '</div>';
      items.forEach(function(a){
        const n=findNode(a.node); if(!n) return;
        h+='<button class="chip '+n.subj+(chipSel===a.i?" on":"")+(a.done?" done":"")+'"'
          + ' onclick="tapChip(event,'+a.i+')">'
          + '<span class="t">'+esc(n.title)+'</span>'
          + '<span class="s">S'+a.s+'</span></button>';
      });
      h+='</div></td>';
    });
    h+='</tr>';
  });
  $("cal").innerHTML=h+'</tbody>';

  const old=document.querySelector(".actbar"); if(old) old.remove();
  if(chipSel!=null){
    const a=byId(chipSel), n=a&&findNode(a.node);
    if(n){
      const bar=document.createElement("div");
      bar.className="actbar";
      bar.innerHTML='<span class="nm">'+esc(n.title)+'</span>'
        + '<button class="btn sm" onclick="setSession('+a.i+','+(a.s===1?2:1)+')">세션 '+(a.s===1?2:1)+'로</button>'
        + '<button class="btn sm" onclick="toggleDone('+a.i+')">'+(a.done?"완료 취소":"완료")+'</button>'
        + '<button class="btn sm" onclick="startMove()">'+(moving?"옮기는 중… 날짜를 누르세요":"날짜 옮기기")+'</button>'
        + '<button class="btn sm danger" onclick="removeAssign('+a.i+')">삭제</button>'
        + '<button class="btn sm" onclick="closeChip()">닫기</button>';
      document.body.appendChild(bar);
    }
  }
}
function tapChip(e,i){
  if(moving) return;            /* 옮기는 중이면 칸(날짜)이 클릭을 받게 둔다 */
  e.stopPropagation();
  chipSel = (chipSel===i? null : i);
  const a=byId(i); if(a) UI.sel=a.node;
  jsave(LS.ui,UI); draw(); }
function closeChip(){ chipSel=null; moving=false; draw(); }
function startMove(){ moving=true; draw(); }
function dropOn(key){ const a=byId(chipSel);
  if(a){ a.date=key; } moving=false; commit(); }
function clearMonth(){
  if(!list().length){ toast("이 달은 이미 비어 있어요"); return; }
  if(!confirm(cursor.getMonth()+1+"월 계획을 전부 지울까요? 되돌릴 수 없습니다.")) return;
  PLAN[ym]=[]; chipSel=null; commit(); toast("이 달 계획을 비웠어요");
}

/* ==========================================================
   요약 띠
   ========================================================== */
function drawSum(){
  const items=list();
  let mMin=0,eMin=0,done=0;
  items.forEach(function(a){
    const n=findNode(a.node); if(!n) return;
    if(n.subj==="math") mMin+=n.min; else eMin+=n.min;
    if(a.done) done++;
  });
  let total=0; T.forEach(function(s){ s.units.forEach(function(u){ total+=u.nodes.length; }); });
  const used={}; items.forEach(function(a){ used[a.node]=true; });
  const rest=total-Object.keys(used).length;

  const over=weeks().reduce(function(c,row){
    return c + row.filter(function(d){ return inMonth(d) && loadMin(dkey(d))>60; }).length; },0);

  $("sumbar").innerHTML=
     tile("배정",items.length,"개")
   + tile("완료",done,"개")
   + tile("수학",mMin,"분","math")
   + tile("영어",eMin,"분","eng")
   + tile("아직 안 넣은 주제",rest,"개")
   + tile("60분 넘는 날",over,"일",over?"warn":"");
}
function tile(label,v,unit,cls){
  return '<div class="tile '+(cls||"")+'"><s>'+label+'</s><b>'+v+'<i>'+unit+'</i></b></div>';
}

/* ==========================================================
   VS Code 호출
   ========================================================== */
function normRoot(){
  let p=($("rootPath").value||ROOT).trim().replace(/\\/g,"/").replace(/\/+$/,"");
  return p;
}
function vscode(rel){
  const uri="vscode://file/"+encodeURI(normRoot()+(rel?"/"+rel:""));
  location.href=uri;
  toast("VS Code 로 열었어요");
}
function openRoot(){ vscode(""); }
function openCurriculum(){ vscode("curriculum.js"); }
function openNote(id,subj){ vscode("curriculum/"+subj+"/"+id+".md"); }

/* ==========================================================
   노드 추가 (임시 → curriculum.js 로 승격)
   ========================================================== */
function addNode(){
  const units=[];
  T.forEach(function(s){ s.units.forEach(function(u){ units.push(u); }); });
  const menu=units.map(function(u,i){ return (i+1)+". "+subjOf(u.subj).name+" · "+u.name; }).join("\n");
  const pickN=prompt("어느 단원에 넣을까요? 번호를 적어주세요.\n\n"+menu);
  if(!pickN) return;
  const u=units[parseInt(pickN,10)-1];
  if(!u){ toast("그런 번호는 없어요"); return; }

  const title=prompt("주제 이름 (마인드맵에 보일 이름)");
  if(!title) return;
  const min=parseInt(prompt("예상 시간 (분)","15"),10)||15;
  const desc=prompt("한 줄 설명","")||"";

  let k=1; while(findNode(u.id+"-x"+k)) k++;
  EXTRA.push({ id:u.id+"-x"+k, unit:u.id, title:title, min:min, desc:desc,
    how:["(학습방법을 여기에 적으세요)"], check:"(통과 기준을 정하세요)",
    app:{ mode: subjOf(u.subj).id==="math" ? "math" : "words" } });
  jsave(LS.extra,EXTRA);
  T=tree(); UI.open["u:"+u.id]=true; UI.sel=u.id+"-x"+k;
  jsave(LS.ui,UI); draw();
  toast("추가했어요. 정식 등록은 '코드 복사' 로");
}
function copyNodeCode(id){
  const n=findNode(id); if(!n) return;
  const code = '          { id:"'+n.id+'", title:"'+n.title+'", min:'+n.min+',\n'
    + '            desc:"'+n.desc+'",\n'
    + '            how:['+n.how.map(function(h){ return '"'+h+'"'; }).join(",\n                 ")+'],\n'
    + '            check:"'+n.check+'",\n'
    + '            app:'+JSON.stringify(n.app).replace(/"(\w+)":/g,"$1:")+' },';
  navigator.clipboard.writeText(code).then(function(){
    toast("복사했어요 — curriculum.js 에 붙여넣으세요");
  },function(){ prompt("복사해서 curriculum.js 에 붙여넣으세요", code); });
}
function dropExtra(id){
  EXTRA=EXTRA.filter(function(n){ return n.id!==id; });
  Object.keys(PLAN).forEach(function(k){
    PLAN[k]=PLAN[k].filter(function(a){ return a.node!==id; }); });
  jsave(LS.extra,EXTRA); jsave(LS.plan,PLAN);
  if(UI.sel===id) UI.sel=null;
  T=tree(); draw(); toast("임시 노드를 지웠어요");
}

/* ==========================================================
   계획 저장 · 불러오기
   ========================================================== */
function savePlan(){
  const doc={ kind:"catstudy-plan", version:1, saved:todayKey(), plan:PLAN, extra:EXTRA };
  const blob=new Blob([JSON.stringify(doc,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="계획.json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("계획.json 을 내려받았어요 — 프로젝트 폴더에 두세요");
}
function importPlan(el){
  const f=el.files&&el.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const d=JSON.parse(r.result);
      if(d.kind!=="catstudy-plan") throw 0;
      PLAN=d.plan||{}; EXTRA=d.extra||[];
      jsave(LS.plan,PLAN); jsave(LS.extra,EXTRA);
      T=tree(); chipSel=null; draw();
      toast("계획을 불러왔어요");
    }catch(e){ toast("계획 파일이 아니에요"); }
    el.value="";
  };
  r.readAsText(f);
}

/* ==========================================================
   달 이동 · 그리기
   ========================================================== */
function setMonth(d){
  cursor=new Date(d.getFullYear(),d.getMonth(),1);
  ym=ymOf(cursor);
  $("mLabel").textContent=cursor.getFullYear()+"년 "+(cursor.getMonth()+1)+"월";
  $("calTitle").textContent=(cursor.getMonth()+1)+"월 계획";
  chipSel=null; moving=false;
  draw();
}
function moveMonth(n){ setMonth(new Date(cursor.getFullYear(),cursor.getMonth()+n,1)); }
function thisMonth(){ setMonth(new Date()); }

function draw(){ drawSum(); drawMap(); drawDetail(); drawCal(); }

/* ==========================================================
   시작
   ========================================================== */
(function init(){
  PLAN  = jload(LS.plan,{});
  EXTRA = jload(LS.extra,[]);
  UI    = jload(LS.ui,{open:{},sel:null});
  if(!UI.open) UI.open={};
  ROOT  = jload(LS.root,null) || ROOT;
  $("rootPath").value=ROOT;
  $("rootPath").addEventListener("change",function(){
    ROOT=normRoot(); $("rootPath").value=ROOT; jsave(LS.root,ROOT); toast("폴더 경로를 기억했어요");
  });

  T=tree();
  if(!Object.keys(UI.open).length){
    T.forEach(function(s){ UI.open["s:"+s.id]=true;
      s.units.forEach(function(u){ UI.open["u:"+u.id]=true; }); });
  }
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeChip(); });
  setMonth(new Date());
})();
</script>
